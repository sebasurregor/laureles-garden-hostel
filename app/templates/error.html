<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} · {{ NOMBRE_HOSTAL }}</title>
    <link rel="icon" href="{{ url_for('static', filename='icono.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<main class="pagina-centrada">
    <div class="caja-login caja-error">
        <p class="codigo-error">{{ codigo }}</p>
        <h1>{{ titulo }}</h1>
        <p class="sub">{{ mensaje }}</p>
        {% if usuario_actual %}
        <a class="boton grande" href="{{ url_for('estancias.en_casa') }}">Ir al inicio</a>
        {% else %}
        <a class="boton grande" href="{{ url_for('auth.login') }}">Ir al inicio de sesión</a>
        {% endif %}
    </div>
</main>
</body>
</html>
