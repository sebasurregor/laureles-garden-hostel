# Blueprint de despliegue controlado en Render con HTTPS automático (HU-09).
# Conecta tu repositorio de GitHub en https://dashboard.render.com -> New -> Blueprint.
databases:
  - name: laureles-garden-db
    databaseName: laureles_garden
    user: laureles_garden_user
    plan: free

services:
  - type: web
    name: laureles-garden-hostel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: laureles-garden-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: ENTORNO
        value: "produccion"
      - key: APP_VERSION
        value: "2.0.0"
      - key: NOMBRE_HOSTAL
        value: "Laureles Garden Hostel"
      - key: FORZAR_HTTPS
        value: "1"
      - key: CONFIAR_PROXY
        value: "1"
      - key: SOLO_LOCAL
        value: "0"
      - key: USAR_POOL_CONEXIONES
        value: "1"
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "8"
